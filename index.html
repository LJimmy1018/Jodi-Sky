<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jodi Sky - Star Register</title>
    <!-- 引入 3D 引擎 Three.js 與天文引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #ffffff;
        }

        #ar-camera-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
            display: none;
            pointer-events: none !important;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            will-change: transform;
        }

        /* 首次命名彈窗 (最高優先級層級) */
        #naming-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999999 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, rgba(10, 15, 30, 0.98) 0%, rgba(2, 2, 8, 0.99) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: opacity 0.5s ease;
            pointer-events: auto !important;
        }

        .naming-card {
            width: 86%;
            max-width: 330px;
            padding: 32px 24px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(147, 197, 253, 0.5);
            border-radius: 26px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.9), 0 0 30px rgba(96, 165, 250, 0.3);
            pointer-events: auto !important;
        }

        .naming-card h1 {
            font-size: 1.45rem;
            color: #e0f2fe;
            margin-bottom: 8px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 14px rgba(147, 197, 253, 0.6);
        }

        .naming-card p {
            font-size: 0.82rem;
            color: #94a3b8;
            margin-bottom: 22px;
            line-height: 1.5;
        }

        #name-input {
            width: 100%;
            padding: 13px;
            border-radius: 30px;
            border: 1.5px solid rgba(147, 197, 253, 0.5);
            background: rgba(15, 23, 42, 0.85);
            color: #ffffff;
            font-size: 1.05rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            pointer-events: auto !important;
            -webkit-user-select: auto;
            user-select: auto;
        }

        #name-input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(96, 165, 250, 0.6);
        }

        #enter-btn {
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #ffffff;
            font-size: 1.02rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(37, 99, 235, 0.6);
            pointer-events: auto !important;
            transition: transform 0.1s;
        }

        #enter-btn:active {
            transform: scale(0.95);
        }

        /* 頂部極簡標題 */
        #hud-top {
            position: fixed;
            top: 20px;
            left: 0;
            width: 100%;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
            padding: 0 16px;
        }

        .star-title-box {
            background: rgba(10, 16, 32, 0.78);
            border: 1px solid rgba(147, 197, 253, 0.25);
            backdrop-filter: blur(12px);
            padding: 8px 22px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
        }

        .main-star-heading {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        #star-owner-name {
            background: linear-gradient(135deg, #ffffff 20%, #fed7aa 60%, #f472b6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(244, 114, 182, 0.5);
        }

        .skat-badge {
            font-size: 0.95rem;
            font-weight: 600;
            background: linear-gradient(135deg, #a5f3fc 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 12px rgba(165, 243, 252, 0.6);
        }

        #hud-sub-desc {
            font-size: 0.72rem;
            color: #93c5fd;
            margin-top: 3px;
        }

        /* 純淨星標 */
        #star-hud-label {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            will-change: transform;
            transition: opacity 0.2s ease;
        }

        .hud-tag {
            background: rgba(10, 16, 32, 0.85);
            border: 1px solid rgba(165, 243, 252, 0.7);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.76rem;
            color: #e0f2fe;
            white-space: nowrap;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 底部精簡美學 Dock 欄 */
        #bottom-dock {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(13, 20, 38, 0.85);
            border: 1px solid rgba(147, 197, 253, 0.3);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 5px 8px;
            border-radius: 36px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            max-width: 82vw;
            pointer-events: auto !important;
        }

        .dock-btn {
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.76rem;
            display: flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        .dock-btn:active {
            transform: scale(0.94);
        }

        #dock-my-star {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.9), rgba(124, 58, 237, 0.9));
            color: #ffffff;
            font-weight: 600;
            padding: 8px 14px;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
        }

        .dock-btn.mode-active {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
        }

        /* 📍 獨立圓形焦點按鈕 */
        #recenter-fab {
            position: fixed;
            bottom: calc(20px + env(safe-area-inset-bottom));
            right: 16px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.9);
            border: 1.5px solid rgba(147, 197, 253, 0.4);
            backdrop-filter: blur(12px);
            color: #ffb6c1;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6), 0 0 15px rgba(244, 114, 182, 0.3);
            transition: transform 0.2s, background 0.2s;
            pointer-events: auto !important;
        }

        #recenter-fab:active {
            transform: scale(0.9);
            background: rgba(30, 58, 138, 0.8);
        }

        /* 模式選擇彈窗 */
        #mode-select-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 135;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 4, 12, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
        }

        .mode-select-card {
            background: rgba(13, 20, 38, 0.96);
            border: 1px solid rgba(147, 197, 253, 0.35);
            border-radius: 24px;
            padding: 24px 20px;
            max-width: 320px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        }

        .mode-option-btn {
            width: 100%;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(147, 197, 253, 0.3);
            color: #f1f5f9;
            padding: 14px 16px;
            border-radius: 16px;
            margin-bottom: 12px;
            font-size: 0.88rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-option-btn:active {
            background: #2563eb;
            color: #ffffff;
            transform: scale(0.97);
        }

        .mode-icon-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .mode-desc-text {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .mode-desc-title {
            font-weight: 600;
            font-size: 0.92rem;
            color: #ffffff;
        }

        .mode-desc-sub {
            font-size: 0.72rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* 星球漫遊彈卡 */
        #star-info-popup {
            position: fixed;
            bottom: calc(85px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            z-index: 35;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(147, 197, 253, 0.4);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            padding: 14px 18px;
            width: 88%;
            max-width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: none;
            animation: popUp 0.3s ease;
        }

        @keyframes popUp {
            from { opacity: 0; transform: translate(-50%, 15px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        .popup-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 6px;
        }

        .popup-title {
            font-size: 1rem;
            font-weight: 600;
            color: #a5f3fc;
        }

        .popup-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.1rem;
            cursor: pointer;
        }

        .popup-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 12px;
            font-size: 0.78rem;
        }

        .popup-label { color: #94a3b8; font-size: 0.7rem; }
        .popup-val { color: #f1f5f9; font-weight: 500; }

        /* 休息提醒彈窗 */
        #resting-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 120;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 4, 12, 0.88);
            backdrop-filter: blur(14px);
            padding: 20px;
            transition: opacity 0.5s ease;
        }

        .resting-card {
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid rgba(147, 197, 253, 0.35);
            border-radius: 26px;
            padding: 30px 22px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.85);
        }

        .resting-icon { font-size: 2.6rem; margin-bottom: 12px; display: block; }
        .resting-title { font-size: 1.15rem; color: #ffd700; margin-bottom: 14px; font-weight: 600; }
        .resting-text {
            font-size: 0.95rem; color: #f1f5f9; line-height: 1.7; margin-bottom: 22px;
            background: rgba(30, 41, 59, 0.6); padding: 14px; border-radius: 16px; border-left: 3px solid #ffd700; text-align: left;
        }

        .resting-btn {
            background: linear-gradient(135deg, #2563eb, #3b82f6); border: none; color: white;
            padding: 12px 28px; border-radius: 25px; font-size: 0.9rem; font-weight: 600; cursor: pointer;
        }

        /* 地點選擇彈窗 */
        #location-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 130;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(2, 4, 12, 0.88);
            backdrop-filter: blur(12px);
            padding: 20px;
        }

        .location-card {
            background: rgba(13, 20, 38, 0.96);
            border: 1px solid rgba(147, 197, 253, 0.35);
            border-radius: 24px;
            padding: 24px 20px;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
        }

        .city-chips-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin: 14px 0 16px;
        }

        .city-chip {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(147, 197, 253, 0.2);
            color: #e2e8f0;
            padding: 8px 4px;
            border-radius: 12px;
            font-size: 0.76rem;
            text-align: center;
            cursor: pointer;
        }

        .city-chip.highlight {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            border-color: #38bdf8;
            color: #ffffff;
            font-weight: 600;
        }

        .city-chip:active { background: #2563eb; color: #ffffff; }

        /* 「我的星星」抽屜視窗 */
        #my-star-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 110;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            background: rgba(2, 4, 10, 0.7);
            backdrop-filter: blur(8px);
            transition: opacity 0.4s ease;
        }

        .sheet-container {
            background: rgba(13, 20, 38, 0.96);
            border-top: 1px solid rgba(147, 197, 253, 0.3);
            border-radius: 28px 28px 0 0;
            max-height: 86vh;
            overflow-y: auto;
            padding: 22px 20px calc(30px + env(safe-area-inset-bottom));
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
            -webkit-overflow-scrolling: touch;
        }

        .sheet-header {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
            padding-bottom: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sheet-header h3 { font-size: 1.25rem; color: #e0f2fe; display: flex; align-items: center; gap: 6px; }
        .close-btn { background: rgba(255, 255, 255, 0.1); border: none; color: #cbd5e1; font-size: 1.1rem; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }

        .star-photo-card {
            position: relative; width: 100%; height: 170px; border-radius: 18px; overflow: hidden;
            border: 1px solid rgba(147, 197, 253, 0.3); margin-bottom: 16px; background-color: #050814;
        }
        .star-photo-img { width: 100%; height: 100%; object-fit: cover; }
        .photo-badge {
            position: absolute; bottom: 8px; right: 8px; background: rgba(0, 0, 0, 0.75);
            font-size: 0.68rem; color: #93c5fd; padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .section-title { font-size: 0.88rem; color: #93c5fd; margin: 12px 0 8px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        
        .meaning-box {
            background: rgba(30, 41, 59, 0.45); border-radius: 16px; padding: 14px 16px; font-size: 0.84rem; line-height: 1.7; color: #e2e8f0; border-left: 3px solid #f472b6;
        }
        
        .forecast-card { background: rgba(20, 30, 55, 0.7); border: 1px solid rgba(96, 165, 250, 0.3); border-radius: 16px; padding: 14px 16px; margin-top: 6px; }
        .forecast-row { display: flex; justify-content: space-between; font-size: 0.82rem; margin: 6px 0; color: #cbd5e1; }
        .forecast-val { font-weight: 600; color: #ffd700; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
        .status-item { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; padding: 10px 12px; }
        .status-label { font-size: 0.7rem; color: #94a3b8; margin-bottom: 3px; }
        .status-val { font-size: 0.88rem; font-weight: 600; color: #e0f2fe; }

        .hidden { display: none !important; opacity: 0; visibility: hidden; }
    </style>
</head>
<body>
    <video id="ar-camera-video" playsinline autoplay muted></video>
    <div id="canvas-container"></div>

    <!-- 首次命名介面 -->
    <div id="naming-modal">
        <div class="naming-card">
            <h1>✨ 專屬星空註冊</h1>
            <p>這顆恆星在深空中守候了數億年<br>請為它鐫刻專屬的名字</p>
            <input type="text" id="name-input" placeholder="輸入名字 (預設: Jodi)" maxlength="16" autocomplete="off">
            <button id="enter-btn" onclick="handleConfirmName()">點亮並前往這顆星</button>
        </div>
    </div>

    <!-- 頂部資訊列 -->
    <div id="hud-top" class="hidden">
        <div class="star-title-box">
            <div class="main-star-heading">
                <span id="star-owner-name">Jodi</span>
                <span class="skat-badge">(Skat)</span>
            </div>
            <div id="hud-sub-desc">水瓶座 δ 星 · 正在分析肉眼目測條件...</div>
        </div>
    </div>

    <!-- 底部精簡美學 Dock -->
    <div id="bottom-dock" class="hidden">
        <button class="dock-btn"
